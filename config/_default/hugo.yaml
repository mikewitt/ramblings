languageCode: en-US
theme: ambitious
baseURL: https://mike.witt.gg
title: Mike's Ramblings
copyright: "&copy; {{< year >}} Mike Witt"

buildDrafts: false
buildFuture: false

enableEmoji: true

pagination:
  pagerSize: 100

imaging:
  anchor: Center

taxonomies:
  tag: tags
  category: categories
  author: authors
  series: series

module:
  mounts:
  - source: assets
    target: assets
  - disableWatch: true
    source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json
  - disableWatch: false
    excludeFiles: null
    includeFiles: null
    lang: ''
    source: content
    target: content

build:
  buildStats:
    enable: true
  cachebusters:
  - source: assets/notwatching/hugo_stats\.json
    target: css
  - source: (postcss|tailwind)\.config\.js
    target: css